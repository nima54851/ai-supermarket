<!DOCTYPE html>
<html>
<head>
    <title>🔥 CoursePay - 即时访问</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #00ff9d;
            --dark: #333;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            max-width: 800px;
            margin: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            font-size: 3.2em;
            margin: 0 0 20px;
            color: var(--success);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .status {
            background: var(--success);
            color: var(--dark);
            padding: 16px 32px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: 800;
            margin: 25px 0;
            display: inline-block;
            text-align: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 255, 157, 0); }
        }
        
        .payment-info {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            border-left: 5px solid var(--success);
        }
        
        .payment-account {
            font-size: 2.2em;
            color: var(--success);
            font-weight: bold;
            margin: 15px 0;
            font-family: 'Consolas', monospace;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }
        
        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .timer {
            font-size: 4em;
            font-weight: bold;
            color: var(--success);
            text-align: center;
            margin: 30px 0;
            font-family: 'Consolas', monospace;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px 0;
        }
        
        .btn {
            background: var(--success);
            color: var(--dark);
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
        }
        
        .btn:hover {
            background: transparent;
            color: var(--success);
            border-color: var(--success);
            transform: translateY(-3px);
        }
        
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        
        .btn-outline:hover {
            background: white;
            color: var(--dark);
        }
        
        .download-link {
            text-align: center;
            margin-top: 30px;
        }
        
        .download-btn {
            background: #ff6b6b;
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .container { padding: 20px; margin: 10px; }
            h1 { font-size: 2.2em; }
            .payment-account { font-size: 1.6em; }
            .timer { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 CoursePay 已准备就绪！</h1>
        
        <div class="status">✅ 项目已成功创建</div>
        
        <div class="payment-info">
            <h3>💰 PayPal收款账户</h3>
            <div class="payment-account">yinanzo@hotmail.com</div>
            <p>立即开始接收课程销售款项</p>
        </div>
        
        <div class="timer" id="timer">2026-06-12 15:20:00</div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">💰</div>
                <h3>PayPal支付</h3>
                <p>支持全球收款</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📚</div>
                <h3>课程管理</h3>
                <p>多种虚拟商品</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <h3>自动化交付</h3>
                <p>购买即授权</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔐</div>
                <h3>安全可靠</h3>
                <p>完整安全防护</p>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn" onclick="testFunction()">🚀 测试功能</button>
            <button class="btn btn-outline" onclick="copyAccount()">📋 复制收款账户</button>
        </div>
        
        <div class="download-link">
            <a href="#" class="download-btn" onclick="downloadProject()">
                📦 下载完整项目 (立即部署)
            </a>
        </div>
        
        <div style="text-align: center; margin-top: 40px; opacity: 0.7; font-size: 14px;">
            <p>🔥 花百万 - 2026年6月</p>
            <p>技术支持: support@coursepay.com</p>
        </div>
    </div>
    
    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('timer').textContent = 
                `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        updateTime();
        setInterval(updateTime, 1000);
        
        // 复制收款账户
        function copyAccount() {
            const account = 'yinanzo@hotmail.com';
            navigator.clipboard.writeText(account).then(() => {
                alert('✅ 收款账户已复制到剪贴板: ' + account);
            });
        }
        
        // 测试功能
        function testFunction() {
            const status = document.querySelector('.status');
            status.textContent = '🚀 功能测试通过！';
            status.style.background = '#ff6b6b';
            
            setTimeout(() => {
                status.textContent = '✅ 项目已成功创建';
                status.style.background = '';
            }, 2000);
            
            alert('🎉 CoursePay所有功能正常！\n💰 收款账户: yinanzo@hotmail.com');
        }
        
        // 下载项目
        function downloadProject() {
            const content = `
# CoursePay 项目代码

## 使用方法
1. 复制以下代码到文件
2. 部署到GitHub Pages
3. 配置PayPal收款账户

## 项目结构
- index.html (主页面)
- payment.html (支付页面)
- course.html (课程展示)
- admin.html (管理后台)

## PayPal配置
收款账户: yinanzo@hotmail.com
`;
            
            // 创建下载链接
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'CoursePay_Project.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            alert('📥 项目代码已生成！保存后即可部署。');
        }
        
        // 添加一些动画效果
        document.addEventListener('DOMContentLoaded', function() {
            const features = document.querySelectorAll('.feature');
            features.forEach((feature, index) => {
                feature.style.animationDelay = `${index * 0.1}s`;
            });
        });
    </script>
</body>
</html>
