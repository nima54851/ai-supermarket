<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <!-- Globe arcs -->
  <ellipse cx="40" cy="40" rx="13" ry="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="12" y1="40" x2="68" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- The needle (points toward insight: upper-right) -->
  <polygon points="40,13 43,37 40,32 37,37" fill="white"/>
  <polygon points="40,32 43,37 40,62 37,37" fill="rgba(255,255,255,0.38)"/>
  
  <!-- Center pivot -->
  <circle cx="40" cy="40" r="4.5" fill="white"/>
  <circle cx="40" cy="40" r="2.2" fill="#1D4ED8"/>
  
  <!-- Cardinal ticks -->
  <line x1="40" y1="13" x2="40" y2="16" stroke="rgba(255,255,255,0.75)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="40" y1="64" x2="40" y2="67" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="40" x2="16" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="40" x2="67" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- "一点通" focal dot -->
  <circle cx="51" cy="21" r="2.5" fill="rgba(255,255,255,0.85)"/>
</svg>
