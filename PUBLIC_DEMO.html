<!DOCTYPE html>
<html>
<head>
    <title>🔥 花百万的CoursePay - 公网演示</title>
    <meta charset="utf-8">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .demo {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            max-width: 700px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }
        h1 {
            color: #00ff9d;
            font-size: 3em;
            margin: 0 0 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .status {
            background: #00ff9d;
            color: #333;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            display: inline-block;
        }
        .code {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Consolas', monospace;
            text-align: left;
            margin: 25px 0;
        }
        .payment {
            color: #00ff9d;
            font-size: 1.8em;
            margin: 20px 0;
            font-weight: bold;
        }
        .timestamp {
            font-size: 2em;
            color: #00ff9d;
            margin: 25px 0;
            font-family: 'Consolas', monospace;
        }
        .qr {
            width: 180px;
            height: 180px;
            background: white;
            margin: 20px auto;
            padding: 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="demo">
        <h1>🎉 CoursePay 公网演示</h1>
        
        <div class="status">✅ 服务器已确认运行</div>
        
        <p><strong>💰 PayPal收款账户：</strong></p>
        <p class="payment">yinanzo@hotmail.com</p>
        
        <div class="timestamp" id="timer">正在加载时间...</div>
        
        <div class="code">
            <h3>📊 项目信息：</h3>
            <p>• 名称：CoursePay 课程销售平台</p>
            <p>• 端口：8080 (本地服务器)</p>
            <p>• 状态：HTTP 200 OK</p>
            <p>• 启动时间：2026-06-12</p>
        </div>
        
        <div class="qr">
            <!-- 二维码占位 -->
            <div style="width:100%;height:100%;background:#f0f0f0;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#333;font-size:14px;">
                扫码查看服务器状态
            </div>
        </div>
        
        <p style="opacity:0.8;">如果这个页面能显示，说明服务器正常运行！</p>
        <p style="opacity:0.6;font-size:14px;margin-top:30px;">🔥 花百万 - 2026年6月</p>
    </div>
    
    <script>
        function updateTimer() {
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('timer').textContent = 
                `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        updateTimer();
        setInterval(updateTimer, 1000);
        
        // 添加一点动画
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.querySelector('.status');
            let count = 0;
            setInterval(() => {
                status.style.boxShadow = `0 0 ${20 + Math.sin(count) * 10}px rgba(0, 255, 157, 0.7)`;
                count += 0.1;
            }, 100);
        });
    </script>
</body>
</html>
