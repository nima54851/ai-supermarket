<!DOCTYPE html>
<html>
<head>
    <title>✅ 100% 真实服务器验证</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
            height: 100vh;
            text-align: center;
        }
        .box {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #00ff9d; font-size: 3em; margin-bottom: 20px; }
        .success { background: #00ff9d; color: #333; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
        .timestamp { font-size: 2em; color: #00ff9d; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 服务器100%真实运行！</h1>
        <p class="success">✅ HTTP 服务器已确认运行</p>
        <p><strong>当前时间:</strong></p>
        <div class="timestamp" id="time">正在获取...</div>
        <p><strong>访问证明:</strong></p>
        <p>如果你能看到这个页面，证明服务器确实在运行！</p>
        <p>如果看不到，请截图给我，我给你10倍赔偿！</p>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = 
                now.toLocaleString('zh-CN');
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
