name: Deploy Chat
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "${{ github.event.inputs.html_content }}" > index.html
          git config user.name "lingxi-bot"
          git config user.email "lingxi@openclaw.local"
          git add index.html && git commit -m "💬 更新" && git push
